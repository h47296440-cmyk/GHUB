<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロフィール - G-HUB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <style>
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .game-thumb-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover !important;
      object-position: 50% 50% !important;
      display: block;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <a href="index.html" class="text-xs text-indigo-400 hover:underline font-bold">← トップへ戻る</a>
      <h1 class="text-xl font-black bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">USER PROFILE</h1>
    </div>

    <!-- プロフィールカード -->
    <div class="bg-[#111827] border border-slate-800 p-6 rounded-3xl shadow-2xl flex flex-col md:flex-row items-center gap-6">
      <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-600 to-pink-500 flex items-center justify-center text-4xl shadow-xl border-2 border-white/20">
        👤
      </div>

      <div class="flex-1 text-center md:text-left space-y-2">
        <div class="flex flex-wrap items-center justify-center md:justify-start gap-2">
          <h2 id="prof-name" class="text-2xl font-black text-white">読み込み中...</h2>
          <span id="prof-streak" class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs px-2.5 py-0.5 rounded-full font-bold">🔥 1日連続</span>
        </div>
        <p id="prof-email" class="text-xs text-slate-500 font-mono"></p>
        <p id="prof-bio" class="text-xs text-slate-300 max-w-xl">自己紹介を読み込み中...</p>
      </div>

      <div class="flex md:flex-col gap-2">
        <button onclick="openEditModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition">
          ✏️ 編集
        </button>
      </div>
    </div>

    <!-- ステータスグリッド -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
      <div class="bg-[#111827] p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-500 font-bold block mb-1">所持コイン（売上・投げ銭含む）</span>
        <span id="stat-coins" class="text-xl font-black text-amber-400 font-mono">0 G</span>
      </div>
      <div class="bg-[#111827] p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-500 font-bold block mb-1">プレイヤーLv</span>
        <span id="stat-plvl" class="text-xl font-black text-emerald-400 font-mono">Lv.1</span>
      </div>
      <div class="bg-[#111827] p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-500 font-bold block mb-1">開発者Lv</span>
        <span id="stat-dlvl" class="text-xl font-black text-purple-400 font-mono">Lv.1</span>
      </div>
      <div class="bg-[#111827] p-4 rounded-2xl border border-slate-800">
        <span class="text-xs text-slate-500 font-bold block mb-1">投稿ゲーム数</span>
        <span id="stat-games" class="text-xl font-black text-indigo-400 font-mono">0 本</span>
      </div>
    </div>

    <!-- 投稿ゲーム一覧 -->
    <div class="space-y-4">
      <h3 class="text-lg font-black text-slate-200">🛠️ あなたが公開したゲーム</h3>
      <div id="my-games-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <p class="text-slate-500 text-xs col-span-3">ゲームを読み込み中...</p>
      </div>
    </div>

    <!-- 🎮 あなたのプレイ履歴 ＆ 累計プレイ時間 -->
    <div class="space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-black text-slate-200">🎮 あなたのプレイ履歴 ＆ 累計プレイ時間</h3>
        <span id="my-history-count" class="text-xs text-slate-400 font-mono">0 作品</span>
      </div>
      <div id="my-play-history-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <p class="text-slate-500 text-xs col-span-3">プレイ履歴を読み込み中...</p>
      </div>
    </div>

    <!-- 👥 フレンドのオンライン状況 & プレイ中ゲーム -->
    <div class="space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-black text-slate-200 flex items-center gap-2">
          <span>👥</span> フレンドの活動状況
        </h3>
        <button onclick="initFriendsSection()" class="text-xs text-indigo-400 hover:underline font-bold">🔄 最新状況に更新</button>
      </div>
      <div id="profile-friends-list" class="space-y-3">
        <p class="text-slate-500 text-xs">フレンドを読み込み中...</p>
      </div>
    </div>

  </div>

  <!-- プロフィール編集モーダル -->
  <div id="edit-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-[#111827] border border-slate-700 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl">
      <h3 class="font-bold text-sm text-indigo-400">プロフィール編集</h3>
      <div>
        <label class="block text-xs font-bold mb-1">ユーザー名</label>
        <input type="text" id="edit-username" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold mb-1">自己紹介</label>
        <textarea id="edit-bio" rows="3" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl text-xs outline-none"></textarea>
      </div>
      <button onclick="saveProfile()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2 rounded-xl text-xs">保存する</button>
      <button onclick="closeEditModal()" class="w-full text-slate-500 text-xs">閉じる</button>
    </div>
  </div>

  <script>
    const proxyUrl = window.location.origin + '/supabase';
    const supabase = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');
    let currentUser = null;

    if (('standalone' in window.navigator) && window.navigator.standalone) {
      document.addEventListener('click', function(e) {
        let target = e.target.closest('a');
        if (target && target.href && target.href.startsWith(window.location.origin) && !target.target && !target.hasAttribute('download')) {
          e.preventDefault();
          window.location.assign(target.href);
        }
      }, false);
    }

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('ログインが必要です');
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      document.getElementById('prof-email').innerText = user.email;

      // プロフィール取得
      const { data: prof } = await supabase.from('profiles').select('*').eq('email', user.email).single();
      if (prof) {
        document.getElementById('prof-name').innerText = prof.username || user.email.split('@')[0];
        document.getElementById('prof-bio').innerText = prof.bio || 'よろしくお願いします！';
        document.getElementById('prof-streak').innerText = `🔥 ${prof.streak_count || 1}日連続`;
        document.getElementById('stat-coins').innerText = `${prof.coins || 0} G`;
        document.getElementById('stat-plvl').innerText = `Lv.${prof.player_level || 1}`;
        document.getElementById('stat-dlvl').innerText = `Lv.${prof.dev_level || 1}`;

        document.getElementById('edit-username').value = prof.username || user.email.split('@')[0];
        document.getElementById('edit-bio').value = prof.bio || '';
      }

      // 投稿ゲーム取得（Supabase ＆ サーバーAPI ＆ ローカルストレージ統合）
      let games = [];
      try {
        const { data: supaGames } = await supabase.from('games').select('*').eq('author_email', user.email).order('created_at', { ascending: false });
        if (supaGames) games = supaGames;
      } catch (e) {}

      try {
        const sRes = await fetch('/api/games');
        if (sRes.ok) {
          const allSrv = await sRes.json();
          if (Array.isArray(allSrv)) {
            allSrv.filter(g => g.author_email === user.email).forEach(sg => {
              const existingIdx = games.findIndex(x => x.id === sg.id);
              if (existingIdx >= 0) games[existingIdx] = { ...games[existingIdx], ...sg };
              else games.push(sg);
            });
          }
        }
      } catch (e) {}

      try {
        const localGames = JSON.parse(localStorage.getItem('ghub_local_games') || '[]');
        localGames.filter(g => g.author_email === user.email).forEach(lg => {
          const existingIdx = games.findIndex(x => x.id === lg.id);
          if (existingIdx >= 0) games[existingIdx] = { ...games[existingIdx], ...lg };
          else games.push(lg);
        });
      } catch (e) {}

      const gamesList = document.getElementById('my-games-list');
      document.getElementById('stat-games').innerText = `${games?.length || 0} 本`;

      if (!games || games.length === 0) {
        gamesList.innerHTML = '<p class="text-slate-500 text-xs col-span-3">まだ公開したゲームはありません。</p>';
        return;
      }

      gamesList.innerHTML = games.map(g => `
        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
          <div>
            <div class="aspect-video bg-slate-950 rounded-xl mb-3 overflow-hidden flex items-center justify-center w-full relative">
              ${g.thumbnail_url 
                ? `<img src="${g.thumbnail_url}" alt="${g.title}" loading="lazy" class="game-thumb-img">` 
                : '<span class="text-3xl">🕹️</span>'}
            </div>
            <h4 class="font-bold text-sm text-slate-100 truncate">${g.title}</h4>
            <div class="flex justify-between text-[11px] text-slate-400 mt-2 font-mono">
              <span>❤️ ${g.likes_count || 0} いいね</span>
              <span>🎮 ${g.play_count || 0} 回</span>
            </div>
          </div>
          <div class="mt-3 flex gap-2">
            <a href="play.html?id=${g.id}" class="flex-1 text-center bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-bold text-indigo-400 transition">
              プレイ
            </a>
            <a href="play.html?id=${g.id}" onclick="sessionStorage.setItem('open_edit', 'true')" class="bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1">
              ✏️ 編集
            </a>
          </div>
        </div>
      `).join('');

      initMyPlayHistory();
      initFriendsSection();
      startPresenceHeartbeat();
    }

    // ★★★ あなたのプレイ履歴 ＆ 累計プレイ時間 ★★★
    async function initMyPlayHistory() {
      const container = document.getElementById('my-play-history-list');
      const countBadge = document.getElementById('my-history-count');
      
      let historyList = [];
      try {
        const res = await fetch(`/api/presence?user_email=${encodeURIComponent(currentUser.email)}`);
        if (res.ok) {
          const data = await res.json();
          if (data[currentUser.email] && data[currentUser.email].play_history) {
            historyList = data[currentUser.email].play_history;
          }
        }
      } catch (e) {}

      // localStorageの直近プレイともマージ
      try {
        const recentLocal = JSON.parse(localStorage.getItem('ghub_recent_games') || '[]');
        if (recentLocal.length > 0 && historyList.length === 0) {
          const ids = recentLocal.map(item => typeof item === 'string' ? item : item.id);
          const { data: gList } = await supabase.from('games').select('*').in('id', ids.slice(0, 9));
          if (gList) {
            historyList = gList.map(g => ({
              game_id: g.id,
              game_title: g.title,
              game_thumb: g.thumbnail_url,
              total_seconds: 600,
              last_played_at: new Date().toISOString()
            }));
          }
        }
      } catch (e) {}

      if (!historyList || historyList.length === 0) {
        countBadge.innerText = '0 作品';
        container.innerHTML = '<p class="text-slate-500 text-xs col-span-3">まだ遊んだゲームの履歴はありません。<a href="index.html" class="text-indigo-400 hover:underline ml-1">ゲームを探しに行く →</a></p>';
        return;
      }

      countBadge.innerText = `${historyList.length} 作品`;
      container.innerHTML = historyList.map(item => `
        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
          <div>
            <div class="aspect-video bg-slate-950 rounded-xl mb-3 overflow-hidden flex items-center justify-center w-full relative">
              ${item.game_thumb 
                ? `<img src="${item.game_thumb}" alt="${item.game_title}" loading="lazy" class="game-thumb-img">` 
                : '<span class="text-3xl">🕹️</span>'}
            </div>
            <h4 class="font-bold text-sm text-slate-100 truncate">${item.game_title}</h4>
            <div class="flex justify-between items-center text-[11px] text-slate-400 mt-2 font-mono">
              <span class="text-indigo-400 font-bold bg-indigo-950/40 px-2 py-0.5 rounded border border-indigo-500/30">
                ⏳ プレイ: ${formatPlayTime(item.total_seconds)}
              </span>
              <span class="text-[10px] text-slate-500">${formatLastSeen(item.last_played_at)}</span>
            </div>
          </div>
          <div class="mt-3">
            <a href="play.html?id=${item.game_id}" class="block text-center bg-slate-800 hover:bg-slate-700 py-2 rounded-xl text-xs font-bold text-indigo-400 transition">
              もう一度遊ぶ
            </a>
          </div>
        </div>
      `).join('');
    }

    // ★★★ 👥 フレンドのオンライン状況 & プレイ中ゲーム ★★★
    window.initFriendsSection = async () => {
      const container = document.getElementById('profile-friends-list');
      container.innerHTML = '<div class="text-xs text-slate-500 font-mono">フレンドの状況を取得中...</div>';

      let friendEmails = [];
      try {
        const res = await fetch(`/api/friends?user_email=${encodeURIComponent(currentUser.email)}`);
        if (res.ok) {
          friendEmails = await res.json();
        }
      } catch (e) {}

      try {
        const { data: supaFriends } = await supabase.from('friends').select('friend_email').eq('user_email', currentUser.email);
        if (supaFriends) {
          supaFriends.forEach(f => {
            if (!friendEmails.includes(f.friend_email)) friendEmails.push(f.friend_email);
          });
        }
      } catch (e) {}

      if (friendEmails.length === 0) {
        container.innerHTML = '<p class="text-slate-500 text-xs">フレンドはいません。<a href="index.html" class="text-indigo-400 hover:underline ml-1">ホームのフレンド画面から追加できます</a></p>';
        return;
      }

      let presenceMap = {};
      try {
        const pRes = await fetch(`/api/presence?emails=${encodeURIComponent(friendEmails.join(','))}`);
        if (pRes.ok) presenceMap = await pRes.json();
      } catch (e) {}

      container.innerHTML = friendEmails.map(email => {
        const pres = presenceMap[email] || {
          user_email: email,
          username: email.split('@')[0],
          is_online: false,
          current_game: null,
          last_seen: null,
          play_history: []
        };

        const isOnline = pres.is_online;
        const avatarLetter = (pres.username || email)[0].toUpperCase();
        const safeId = email.replace(/[^a-zA-Z0-9]/g, '_');

        return `
          <div class="bg-[#111827] p-4 rounded-2xl border border-slate-800 space-y-3">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="relative">
                  <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow">
                    ${avatarLetter}
                  </div>
                  <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-[#111827] ${isOnline ? 'bg-emerald-500' : 'bg-slate-500'}"></span>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-xs text-white">${pres.username}</span>
                    ${isOnline 
                      ? `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[10px] font-bold px-2 py-0.2 rounded-full font-mono">🟢 ONLINE</span>`
                      : `<span class="bg-slate-800 text-slate-400 border border-slate-700 text-[10px] px-2 py-0.2 rounded-full font-mono">⚪ OFFLINE</span>`
                    }
                  </div>
                  <span class="text-[10px] text-slate-400 font-mono">${email}</span>
                </div>
              </div>

              <button onclick="toggleFriendHistory('${safeId}')" class="text-xs text-indigo-400 hover:underline flex items-center gap-1 font-bold whitespace-nowrap bg-indigo-950/40 px-2.5 py-1.5 rounded-xl border border-indigo-500/30">
                <span>📊</span> プレイ履歴 (${pres.play_history?.length || 0})
              </button>
            </div>

            ${pres.current_game ? `
              <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-2.5 flex items-center justify-between gap-3">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="text-base animate-pulse">🎮</span>
                  <div class="min-w-0">
                    <span class="text-[10px] font-black text-amber-400 tracking-wider uppercase block">NOW PLAYING</span>
                    <span class="text-xs font-bold text-slate-200 truncate block">${pres.current_game.title}</span>
                  </div>
                </div>
                <a href="play.html?id=${pres.current_game.id}" class="bg-gradient-to-r from-amber-500 to-yellow-500 hover:opacity-90 text-slate-950 text-xs font-black px-3 py-1.5 rounded-lg shadow whitespace-nowrap">
                  一緒にプレイ →
                </a>
              </div>
            ` : (isOnline ? `
              <div class="text-[11px] text-slate-400 font-mono">🏠 G-HUB をブラウズ中</div>
            ` : `
              <div class="text-[11px] text-slate-500 font-mono">💤 最終ログイン: ${pres.last_seen ? formatLastSeen(pres.last_seen) : '記録なし'}</div>
            `)}

            <!-- 展開アコーディオン: プレイ履歴 -->
            <div id="friend-history-${safeId}" class="hidden pt-2 border-t border-slate-800 space-y-2">
              <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                これまでに遊んだゲームと累計時間
              </div>
              ${pres.play_history && pres.play_history.length > 0 ? `
                <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">
                  ${pres.play_history.map(item => `
                    <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                      <span class="text-xs font-bold text-slate-200 truncate">${item.game_title}</span>
                      <div class="flex items-center gap-2 shrink-0">
                        <span class="text-xs font-mono text-indigo-400 bg-indigo-950/60 px-2 py-0.5 rounded border border-indigo-800">
                          ${formatPlayTime(item.total_seconds)}
                        </span>
                        <a href="play.html?id=${item.game_id}" class="text-[11px] text-indigo-400 hover:underline">遊ぶ →</a>
                      </div>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <p class="text-slate-500 text-xs py-1">まだ遊んだゲームの履歴はありません。</p>
              `}
            </div>
          </div>
        `;
      }).join('');
    };

    window.toggleFriendHistory = (safeId) => {
      const el = document.getElementById(`friend-history-${safeId}`);
      if (el) el.classList.toggle('hidden');
    };

    function startPresenceHeartbeat() {
      async function sendHeartbeat() {
        if (!currentUser) return;
        try {
          await fetch('/api/presence', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user_email: currentUser.email,
              username: currentUser.email.split('@')[0],
              status: 'online'
            })
          });
        } catch (e) {}
      }
      sendHeartbeat();
      setInterval(sendHeartbeat, 15000);
    }

    function formatPlayTime(seconds) {
      if (!seconds || seconds <= 0) return '1分未満';
      const m = Math.floor(seconds / 60);
      if (m < 60) return `${m}分`;
      const h = Math.floor(m / 60);
      const remM = m % 60;
      return remM > 0 ? `${h}時間${remM}分` : `${h}時間`;
    }

    function formatLastSeen(isoOrTimestamp) {
      if (!isoOrTimestamp) return '不明';
      const t = new Date(isoOrTimestamp).getTime();
      const diffSec = Math.floor((Date.now() - t) / 1000);
      if (diffSec < 60) return 'たった今';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}分前`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr}時間前`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay}日前`;
    }

    window.openEditModal = () => document.getElementById('edit-modal').classList.remove('hidden');
    window.closeEditModal = () => document.getElementById('edit-modal').classList.add('hidden');

    window.saveProfile = async () => {
      const username = document.getElementById('edit-username').value;
      const bio = document.getElementById('edit-bio').value;

      await supabase.from('profiles').update({ username, bio }).eq('email', currentUser.email);
      alert('プロフィールを更新しました！');
      closeEditModal();
      init();
    };

    init();
  </script>
</body>
</html>
