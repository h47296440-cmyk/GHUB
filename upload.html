<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0f19">
  <link rel="manifest" href="/manifest.json">
  <title>ゲーム公開 - G-HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/esbuild-wasm@0.19.11/lib/browser.min.js"></script>
  <!-- 画面キャプチャ用ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    if (('standalone' in window.navigator) && window.navigator.standalone) {
      document.addEventListener('click', function(e) {
        let target = e.target.closest('a');
        if (target && target.href && target.href.startsWith(window.location.origin) && !target.target && !target.hasAttribute('download')) {
          e.preventDefault();
          window.location.assign(target.href);
        }
      }, false);
    }
  </script>
</head>
<body class="bg-[#1e1e1e] text-white min-h-screen p-4 flex justify-center items-center font-sans">
  <div class="max-w-6xl w-full bg-[#252526] p-6 rounded-2xl border border-[#333] shadow-2xl flex flex-col gap-4">
    
    <div class="flex justify-between items-center border-b border-[#333] pb-3">
      <h1 class="text-xl font-bold text-white flex items-center gap-2">
        📦 G-HUB Uploader (.zip ＆ .html 対応 / Vite & Next.js Engine v9)
      </h1>
      <a href="index.html" class="text-xs text-indigo-400 hover:underline">← トップへ戻る</a>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- サイドバー -->
      <div class="lg:col-span-1 flex flex-col gap-3 text-xs">
        <div id="drop-zone" class="border-2 border-dashed border-[#444] hover:border-indigo-500 rounded-xl p-5 text-center bg-[#2d2d2d] cursor-pointer transition">
          <p class="font-bold text-sm text-slate-200">📁 .zip または .html をドロップ</p>
          <p class="text-[10px] text-slate-400 mt-1">Vite / Next.js / React / 通常HTMLを自動解析</p>
          <input type="file" id="file-input" accept=".zip,.html" class="hidden">
        </div>

        <div id="status" class="p-2 rounded bg-[#2e7d32] text-center font-bold text-xs font-mono">エンジン準備中...</div>

        <!-- サムネイルプレビュー表示枠 -->
        <div class="bg-[#1e1e1e] p-2.5 rounded-xl border border-[#333] flex items-center gap-3">
          <div id="thumb-preview" class="w-16 h-12 bg-slate-900 border border-[#444] rounded flex items-center justify-center text-xs text-slate-500 overflow-hidden relative shrink-0">
            未設定
          </div>
          <div class="flex-1 flex flex-col justify-center">
            <span class="font-bold block text-slate-300">タイトルサムネイル</span>
            <span class="text-[10px] text-slate-400">「📸 撮影」または「🖼️ 画像選択」</span>
            <div class="mt-1 flex gap-1">
              <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] px-2 py-0.5 rounded border border-slate-700 font-bold transition">
                🖼️ 画像選択
                <input type="file" id="thumb-file-input" accept="image/*" class="hidden" onchange="handleThumbnailFile(event)">
              </label>
            </div>
          </div>
        </div>

        <!-- メタ情報入力 -->
        <div class="space-y-2 bg-[#1e1e1e] p-3 rounded-xl border border-[#333]">
          <div>
            <label class="block font-bold mb-1 text-slate-300">タイトル</label>
            <input type="text" id="game-title" required placeholder="ゲームタイトル" class="w-full bg-[#2d2d2d] border border-[#444] p-2 rounded outline-none text-white">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold mb-1 text-slate-300">ジャンル</label>
              <select id="game-tag" class="w-full bg-[#2d2d2d] border border-[#444] p-2 rounded outline-none text-white">
                <option value="Action">アクション</option>
                <option value="Puzzle">パズル</option>
                <option value="RPG">RPG</option>
                <option value="Horror">ホラー</option>
                <option value="Other">その他</option>
              </select>
            </div>
            <div>
              <label class="block font-bold mb-1 text-slate-300">価格</label>
              <select id="game-price" class="w-full bg-[#2d2d2d] border border-[#444] p-2 rounded outline-none text-white">
                <option value="0">無料 (Free)</option>
                <option value="30">30 G</option>
                <option value="50">50 G</option>
                <option value="100">100 G</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block font-bold mb-1 text-slate-300 flex justify-between">
              <span>⏳ 体験版（制限時間）設定</span>
              <span class="text-[10px] text-amber-400 font-normal">時間経過で強制終了</span>
            </label>
            <div class="flex gap-2">
              <select id="game-trial-select" class="flex-1 bg-[#2d2d2d] border border-[#444] p-2 rounded outline-none text-white" onchange="toggleCustomTrial(this)">
                <option value="0">制限なし (無制限)</option>
                <option value="5">5分間 体験版</option>
                <option value="10">10分間 体験版</option>
                <option value="15">15分間 体験版</option>
                <option value="30">30分間 体験版</option>
                <option value="custom">指定 (分)</option>
              </select>
              <input type="number" id="game-trial-custom" placeholder="分" min="1" max="180" class="w-20 bg-[#2d2d2d] border border-[#444] p-2 rounded outline-none text-white hidden">
            </div>
          </div>
          <div>
            <label class="block font-bold mb-1 text-slate-300">説明文</label>
            <textarea id="game-desc" rows="2" placeholder="ゲームの説明や操作方法" class="w-full bg-[#2d2d2d] border border-[#444] p-2 rounded outline-none text-white"></textarea>
          </div>
        </div>

        <div id="terminal" class="bg-[#0e0e0e] text-[#4af626] font-mono text-[10px] p-2.5 rounded h-24 overflow-y-auto border border-[#333] whitespace-pre-wrap">--- ログ ---<br></div>

        <button type="button" onclick="publishToGHub()" id="publish-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-xl shadow-lg transition text-xs">
          🚀 このゲームをG-HUBに公開する
        </button>
      </div>

      <!-- プレビューメインエリア -->
      <div class="lg:col-span-2 flex flex-col h-[560px] bg-[#1e1e1e] rounded-xl border border-[#333] overflow-hidden">
        <div class="h-10 bg-[#2d2d2d] border-b border-[#333] flex justify-between items-center px-4 text-xs text-[#ccc]">
          <span class="font-bold">Preview</span>
          <div class="flex gap-2">
            <!-- 📸 サムネ撮影ボタン -->
            <button type="button" onclick="captureThumbnail()" class="bg-gradient-to-r from-amber-500 to-pink-500 hover:opacity-90 text-slate-950 font-black px-2.5 py-1 rounded text-xs shadow transition flex items-center gap-1">
              📸 この瞬間をサムネにする
            </button>
            <button id="clear-data-btn" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-2 py-1 rounded text-xs">🗑️ セーブ消去</button>
          </div>
        </div>
        <iframe id="preview-iframe" class="flex-1 w-full h-full border-none bg-white"></iframe>
      </div>

    </div>
  </div>

  <script>
    const proxyUrl = window.location.origin + '/supabase';
    const supabase = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const terminal = document.getElementById('terminal');
    const iframe = document.getElementById('preview-iframe');
    const statusEl = document.getElementById('status');
    const clearDataBtn = document.getElementById('clear-data-btn');

    let esbuildReady = false;
    let finalPayload = null;
    let payloadType = 'html';
    let capturedThumbnailBlob = null;

    function log(msg) {
      terminal.innerText += msg + '\n';
      terminal.scrollTop = terminal.scrollHeight;
    }

    window.handleThumbnailFile = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      capturedThumbnailBlob = file;
      const url = URL.createObjectURL(file);
      document.getElementById('thumb-preview').innerHTML = `<img src="${url}" class="w-full h-full object-cover object-center block" style="object-position: center center;">`;
      log(`✅ サムネイル画像を設定しました: ${file.name}`);
    };

    window.captureThumbnail = async () => {
      if (!iframe.contentDocument && !iframe.contentWindow) return alert("ゲーム画面が読み込まれていません！");
      log("📸 サムネイルをキャプチャ中（中央配置・高精度処理）...");

      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const win = iframe.contentWindow || window;

        const canvasEls = doc.querySelectorAll('canvas');
        let sourceCanvas = null;
        if (canvasEls.length > 0) {
          let maxArea = 0;
          canvasEls.forEach(c => {
            const area = (c.width || c.clientWidth || 0) * (c.height || c.clientHeight || 0);
            if (area > maxArea) {
              maxArea = area;
              sourceCanvas = c;
            }
          });
        }

        const targetW = 640;
        const targetH = 360;
        const outCanvas = document.createElement('canvas');
        outCanvas.width = targetW;
        outCanvas.height = targetH;
        const ctx = outCanvas.getContext('2d');
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, targetW, targetH);

        if (sourceCanvas && sourceCanvas.width > 0 && sourceCanvas.height > 0) {
          const sw = sourceCanvas.width;
          const sh = sourceCanvas.height;
          const scale = Math.max(targetW / sw, targetH / sh);
          const dw = sw * scale;
          const dh = sh * scale;
          const dx = (targetW - dw) / 2;
          const dy = (targetH - dh) / 2;
          ctx.drawImage(sourceCanvas, dx, dy, dw, dh);
        } else {
          const rootEl = doc.body || doc.documentElement;
          const renderedCanvas = await html2canvas(rootEl, {
            useCORS: true,
            allowTaint: true,
            logging: false,
            windowWidth: doc.documentElement.clientWidth || win.innerWidth || 800,
            windowHeight: doc.documentElement.clientHeight || win.innerHeight || 600
          });
          const sw = renderedCanvas.width;
          const sh = renderedCanvas.height;
          const scale = Math.max(targetW / sw, targetH / sh);
          const dw = sw * scale;
          const dh = sh * scale;
          const dx = (targetW - dw) / 2;
          const dy = (targetH - dh) / 2;
          ctx.drawImage(renderedCanvas, dx, dy, dw, dh);
        }

        outCanvas.toBlob(blob => {
          capturedThumbnailBlob = blob;
          const url = URL.createObjectURL(blob);
          document.getElementById('thumb-preview').innerHTML = `<img src="${url}" class="w-full h-full object-cover object-center block" style="object-position: center center;">`;
          log("✅ サムネイルの中央撮影が完了しました！");
        }, 'image/jpeg', 0.9);
      } catch (err) {
        log("❌ キャプチャ失敗: " + err.message);
      }
    };

    clearDataBtn.addEventListener('click', () => {
      if (!iframe.srcdoc) return alert("ゲームが読み込まれていません");
      iframe.contentWindow.localStorage.clear();
      iframe.contentWindow.sessionStorage.clear();
      const doc = iframe.srcdoc;
      iframe.srcdoc = '';
      setTimeout(() => iframe.srcdoc = doc, 50);
      log("🗑️ セーブデータを消去しました。");
    });

    async function initEsbuild() {
      try {
        await esbuild.initialize({ wasmURL: 'https://cdn.jsdelivr.net/npm/esbuild-wasm@0.19.11/esbuild.wasm' });
        esbuildReady = true;
        statusEl.innerText = "⚡ エンジン準備完了 (v9)";
        log("✅ esbuild-wasm エンジン準備完了。");
      } catch (e) { log("❌ 初期化失敗: " + e.message); }
    }
    initEsbuild();

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      if (!file) return;

      if (file.name.toLowerCase().endsWith('.html')) {
        log(`\n📄 単一HTMLファイルを検出: ${file.name}`);
        document.getElementById('game-title').value = file.name.replace('.html', '');
        const htmlText = await file.text();
        iframe.srcdoc = htmlText;
        finalPayload = new Blob([htmlText], { type: 'text/html' });
        payloadType = 'html';
        log('🚀 プレビュー描画完了！');
        return;
      }

      if (file.name.toLowerCase().endsWith('.zip')) {
        await processZip(file);
      } else {
        alert('.zip または .html ファイルを選択してください！');
      }
    }

    // ★★★ 添付ファイル Local Zip Runner v9 準拠の完全堅牢バンドル処理 ★★★
    async function processZip(file) {
      if (!esbuildReady) return alert("esbuild 準備中...");
      document.getElementById('game-title').value = file.name.replace('.zip', '');
      log(`\n📦 Zipファイルを解析中: ${file.name}`);

      try {
        const zip = await JSZip.loadAsync(file);
        const files = {};
        const paths = Object.keys(zip.files);

        let prefix = '';
        const rootFolders = new Set(paths.map(p => p.split('/')[0]).filter(Boolean));
        if (rootFolders.size === 1) prefix = Array.from(rootFolders)[0] + '/';

        for (const [path, entry] of Object.entries(zip.files)) {
          if (entry.dir) continue;
          let cleanPath = prefix && path.startsWith(prefix) ? path.slice(prefix.length) : path;
          files[cleanPath] = await entry.async('text');
        }

        let html = files['index.html'] || files['public/index.html'];
        const isNextApp = !html && (files['app/page.tsx'] || files['app/page.jsx'] || files['src/app/page.tsx'] || files['src/app/page.jsx']);

        if (!html) {
          log('ℹ️ index.html を自動生成します。');
          html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${file.name.replace('.zip', '')}</title></head><body><div id="root"></div></body></html>`;
        }

        const entryCandidates = [
          'app/page.tsx', 'app/page.jsx', 'src/app/page.tsx', 'src/app/page.jsx',
          'src/main.tsx', 'src/main.jsx', 'src/index.tsx', 'src/index.jsx', 'src/App.tsx', 'src/App.jsx',
          'main.tsx', 'main.jsx', 'index.tsx', 'index.jsx', 'App.tsx', 'App.jsx',
          'src/main.ts', 'src/main.js', 'src/index.ts', 'src/index.js'
        ];
        let entryPath = entryCandidates.find(e => files[e] !== undefined);

        if (!entryPath) {
          entryPath = Object.keys(files).find(p => p.endsWith('.tsx') || p.endsWith('.jsx'));
        }

        if (!entryPath) {
          iframe.srcdoc = html;
          finalPayload = file;
          payloadType = 'zip';
          return log('🚀 静的HTMLゲームとして描画完了！');
        }

        log(`⚡ esbuild でビルド中 (${entryPath})...`);

        const zipPlugin = {
          name: 'zip-vfs',
          setup(build) {
            build.onResolve({ filter: /.*/ }, args => {
              let target = args.path.startsWith('/') ? args.path.slice(1) : args.path;

              if (args.path.startsWith('@/')) target = args.path.slice(2);

              const isRelative = args.path.startsWith('.');
              const isAbsoluteLocal = files[target] !== undefined || files['src/' + target] !== undefined;

              if (isRelative || isAbsoluteLocal || args.kind === 'entry-point' || args.path.startsWith('@/')) {
                if (args.importer && isRelative) {
                  const basePath = args.importer.split('/').slice(0, -1).join('/');
                  const rawPath = basePath ? basePath + '/' + args.path : args.path;
                  const parts = rawPath.split('/');
                  const stack = [];
                  for (const p of parts) {
                    if (p === '.' || p === '') continue;
                    if (p === '..') stack.pop();
                    else stack.push(p);
                  }
                  target = stack.join('/');
                }

                const exts = ['', '.tsx', '.ts', '.jsx', '.js', '.css', '/index.tsx', '/index.ts', '/index.jsx', '/index.js'];
                for (const ext of exts) {
                  if (files[target + ext] !== undefined) return { path: target + ext, namespace: 'zip-vfs' };
                  if (files['src/' + target + ext] !== undefined) return { path: 'src/' + target + ext, namespace: 'zip-vfs' };
                }
                return { path: target, namespace: 'zip-vfs' };
              }

              if (args.path.startsWith('http://') || args.path.startsWith('https://')) {
                return { path: args.path, external: true };
              }

              let pkg = args.path;
              if (pkg === 'react') return { path: 'https://esm.sh/react@18.2.0?dev', external: true };
              if (pkg === 'react-dom') return { path: 'https://esm.sh/react-dom@18.2.0?dev', external: true };
              if (pkg === 'react-dom/client') return { path: 'https://esm.sh/react-dom@18.2.0/client?dev', external: true };
              if (pkg.startsWith('react/')) return { path: `https://esm.sh/${pkg}@18.2.0?dev`, external: true };
              
              return { path: `https://esm.sh/${pkg}?deps=react@18.2.0,react-dom@18.2.0&dev`, external: true };
            });

            build.onLoad({ filter: /.*/, namespace: 'zip-vfs' }, args => {
              let content = files[args.path];
              if (content === undefined) return { errors: [{ text: `File not found: ${args.path}` }] };

              if (args.path.endsWith('.css')) {
                const escapedCss = JSON.stringify(content);
                return { contents: `const style = document.createElement('style'); style.textContent = ${escapedCss}; document.head.appendChild(style);`, loader: 'js' };
              }

              content = content.replace(/^['"]use client['"];?/gm, '').replace(/^['"]use server['"];?/gm, '');

              let loader = 'js';
              if (args.path.endsWith('.tsx')) loader = 'tsx';
              else if (args.path.endsWith('.ts')) loader = 'ts';
              else if (args.path.endsWith('.jsx')) loader = 'jsx';

              return { contents: content, loader };
            });
          }
        };

        const result = await esbuild.build({
          entryPoints: [entryPath],
          bundle: true,
          format: 'esm',
          plugins: [zipPlugin],
          write: false,
          jsx: 'automatic',
          jsxImportSource: 'https://esm.sh/react@18.2.0'
        });

        const bundledJs = result.outputFiles[0].text;
        log('🔗 HTMLとスタイルを準備中...');

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const head = doc.head || doc.createElement('head');

        const tailwindScript = doc.createElement('script');
        tailwindScript.src = "https://cdn.tailwindcss.com";
        head.appendChild(tailwindScript);

        // 安全な URL パッチおよび WebSocket インターセプター
        const patchScript = doc.createElement('script');
        patchScript.textContent = `
          const NativeURL = window.URL;
          window.URL = function(url, base) {
            try {
              if (base) return new NativeURL(url, base);
              return new NativeURL(url, window.location.href.startsWith('http') ? window.location.href : 'http://localhost');
            } catch (e) {
              if (typeof url === 'string' && (url.startsWith('/') || url.startsWith('.'))) {
                return new NativeURL(url, 'http://localhost');
              }
              return new NativeURL('http://localhost/' + String(url).replace(/^\\/+/, ''));
            }
          };
          window.URL.prototype = NativeURL.prototype;
          window.URL.createObjectURL = NativeURL.createObjectURL;
          window.URL.revokeObjectURL = NativeURL.revokeObjectURL;

          const NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (!url || url === 'ws://' || url === 'wss://' || url.startsWith('ws:///') || url.startsWith('wss:///')) {
              return {
                addEventListener: () => {},
                removeEventListener: () => {},
                send: () => {},
                close: () => {}
              };
            }
            return new NativeWebSocket(url, protocols);
          };

          window.addEventListener('error', function(e) {
            if (e.message && (e.message.includes('WebSocket') || e.message.includes('URL'))) {
              e.stopImmediatePropagation();
              return true;
            }
            window.parent.postMessage({ type: 'error', msg: e.message || 'Script load error' }, '*');
          });
        `;
        head.insertBefore(patchScript, head.firstChild);

        const scriptEl = doc.createElement('script');
        scriptEl.type = 'module';

        if (isNextApp) {
          // 🌟 一時的な blob URL ではなく、永続的に自己完結する Base64 Data URL を使用（Blob消失エラーを完全撲滅！）
          const bytes = new TextEncoder().encode(bundledJs);
          let binary = '';
          for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          const base64Js = btoa(binary);
          const dataUrl = `data:text/javascript;base64,${base64Js}`;

          scriptEl.textContent = `
            import React, { Suspense } from 'https://esm.sh/react@18.2.0?dev';
            import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client?dev';

            window.React = React;

            async function render() {
              try {
                const mod = await import('${dataUrl}');
                const Component = mod.default || mod[Object.keys(mod)[0]];
                
                const rootEl = document.getElementById('root');
                if (rootEl && Component) {
                  const root = createRoot(rootEl);
                  root.render(
                    React.createElement(Suspense, { fallback: React.createElement('div', null, 'Loading...') },
                      React.createElement(Component)
                    )
                  );
                  window.parent.postMessage({ type: 'success' }, '*');
                } else {
                  window.parent.postMessage({ type: 'error', msg: '描画するコンポーネント (export default) が取得できませんでした。' }, '*');
                }
              } catch(err) {
                window.parent.postMessage({ type: 'error', msg: err.stack || err.message }, '*');
              }
            }
            render();
          `;
        } else {
          scriptEl.textContent = bundledJs;
        }

        doc.querySelectorAll('script[type="module"]').forEach(s => s.remove());
        doc.body.appendChild(scriptEl);

        const finalHtml = doc.documentElement.outerHTML;
        iframe.srcdoc = finalHtml;
        finalPayload = new Blob([finalHtml], { type: 'text/html' });
        payloadType = 'html';
        log('🚀 バンドル完了！プレビューで遊べます！');
      } catch (err) {
        log(`❌ ビルド失敗: ${err.message}`);
      }
    }

    window.toggleCustomTrial = (select) => {
      const customInput = document.getElementById('game-trial-custom');
      if (select.value === 'custom') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
      }
    };

    async function publishToGHub() {
      const title = document.getElementById('game-title').value;
      const tag = document.getElementById('game-tag').value;
      const price = parseInt(document.getElementById('game-price').value);
      const desc = document.getElementById('game-desc').value;
      const trialSelect = document.getElementById('game-trial-select').value;
      let trialMinutes = 0;
      if (trialSelect === 'custom') {
        trialMinutes = parseInt(document.getElementById('game-trial-custom').value) || 0;
      } else {
        trialMinutes = parseInt(trialSelect) || 0;
      }
      const btn = document.getElementById('publish-btn');

      if (!title) return alert('タイトルを入力してください！');
      if (!finalPayload) return alert('ゲームを読み込んでから公開してください！');

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert('公開するにはログインが必要です！');

      btn.disabled = true;
      log('\n🚀 G-HUBにアップロード中...');

      try {
        const gameId = crypto.randomUUID();
        const filename = payloadType === 'html' ? 'index.html' : 'game.zip';

        await supabase.storage.from('games').upload(`${gameId}/${filename}`, finalPayload, {
          contentType: payloadType === 'html' ? 'text/html' : 'application/zip',
          upsert: true
        });
        const entryUrl = supabase.storage.from('games').getPublicUrl(`${gameId}/${filename}`).data.publicUrl;

        let thumbnailUrl = null;
        if (capturedThumbnailBlob) {
          log('📸 サムネイル画像を保存中...');
          const thumbPath = `${gameId}/thumbnail.jpg`;
          await supabase.storage.from('games').upload(thumbPath, capturedThumbnailBlob, { contentType: 'image/jpeg', upsert: true });
          thumbnailUrl = supabase.storage.from('games').getPublicUrl(thumbPath).data.publicUrl;
        }

        await supabase.from('games').insert({
          id: gameId,
          title,
          tag,
          description: desc,
          entry_url: entryUrl,
          thumbnail_url: thumbnailUrl,
          author_email: user.email,
          platforms: 'pc',
          price_coins: price,
          trial_duration_minutes: trialMinutes,
          likes_count: 0,
          play_count: 0
        });

        log('🎉 公開完了！');
        alert('ゲームを公開しました！');
        window.location.href = `play.html?id=${gameId}`;
      } catch (err) {
        log(`❌ 公開失敗: ${err.message}`);
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
